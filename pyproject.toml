[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "nanosay"
version = "0.1.0"
description = "Have anything read out loud, by the voice already inside your computer. Nothing to install."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Priyanshu Agarwal" }]
keywords = ["text-to-speech", "tts", "accessibility", "no-code", "offline", "pdf"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: End Users/Desktop",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Multimedia :: Sound/Audio :: Speech",
  "Topic :: Education",
]
# Nothing is required, on any operating system. It uses the speech engine your operating system already ships with.
dependencies = []

[project.scripts]
nanosay = "nanosay.__main__:main"

[project.urls]
Homepage = "https://github.com/Agarwalrishu13/nanosay"

[tool.setuptools]
packages = ["nanosay"]
include-package-data = true

[tool.setuptools.package-data]
nanosay = ["web/*"]
